name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Kalapak-Team&theme=tokyonight&hide_border=true&background=0d1117&stroke=7b2fff&ring=7b2fff&fire=00d4ff&currStreakNum=c4b5fd&sideNums=c4b5fd&currStreakLabel=7b2fff&sideLabels=7b2fff&dates=888888&disable_animations=true
          path: assets/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git add assets/github-streak.svg

          if git diff --cached --quiet -- assets/github-streak.svg; then
            echo "No streak SVG changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub streak stats"
          git push
